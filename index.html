<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Toán 11 – Các số đặc trưng đo xu thế trung tâm | THPT Trần Phú</title>
<style>
/* ============ ROOT ============ */
:root{
  --blue:#0f9bdc; --blue-d:#0a7ab0; --blue-l:#e6f4fd;
  --red:#e53935; --yellow:#fdd835; --green:#22c55e; --green-l:#dcfce7;
  --orange:#f97316; --purple:#8b5cf6; --pink:#ec4899;
  --bg:#eef7ff; --card:#ffffff; --text:#1e293b; --muted:#64748b;
  --border:#dbeafe; --shadow:0 6px 24px rgba(15,155,220,.13);
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  background:
    radial-gradient(circle at 8% 6%, #d9f0ff 0, transparent 42%),
    radial-gradient(circle at 92% 12%, #fff3c9 0, transparent 38%),
    radial-gradient(circle at 50% 100%, #e3f9e8 0, transparent 45%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text); line-height:1.6; min-height:100vh;
  font-size:15px;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px 60px}

/* ============ HEADER ============ */
header{
  position:sticky;top:0;z-index:80;
  background:linear-gradient(120deg,#0f9bdc,#3bb6ef 55%,#62c9f5);
  box-shadow:0 4px 20px rgba(10,122,176,.28);
  border-radius:0 0 22px 22px;
}
.head-in{max-width:1080px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;flex:1;min-width:200px}
.brand .mascot{width:46px;height:46px;flex:0 0 46px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.brand-txt h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.2px;line-height:1.2}
.brand-txt p{margin:1px 0 0;font-size:11.5px;opacity:.92}
.navbtn{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.42);color:#fff;
  padding:7px 13px;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;
  transition:.2s;white-space:nowrap;font-family:inherit
}
.navbtn:hover{background:rgba(255,255,255,.32);transform:translateY(-1px)}
.navbtn.active{background:#fff;color:var(--blue-d);border-color:#fff}
.navbar{display:flex;gap:6px;flex-wrap:wrap;width:100%}
@media(min-width:720px){.navbar{width:auto}}
.userchip{
  background:rgba(255,255,255,.95);color:var(--blue-d);border-radius:22px;
  padding:5px 13px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.1)
}

/* ============ SCREENS ============ */
.screen{display:none;animation:fade .32s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ CARDS ============ */
.card{
  background:var(--card);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px
}
.card h2{margin:0 0 12px;font-size:19px;color:var(--blue-d);display:flex;align-items:center;gap:8px}
.card h3{margin:16px 0 8px;font-size:16px;color:var(--blue-d)}
.sec-title{
  font-size:22px;font-weight:800;color:var(--blue-d);margin:22px 0 12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap
}
.sec-title .badge{
  font-size:11px;background:var(--yellow);color:#7a5b00;padding:3px 10px;border-radius:20px;
  font-weight:800;letter-spacing:.4px
}

/* ============ FORM ============ */
.field{margin-bottom:13px}
.field label{display:block;font-weight:700;font-size:13.5px;margin-bottom:5px;color:var(--blue-d)}
.field input,.field select{
  width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;
  font-size:15px;font-family:inherit;background:#fafdff;transition:.18s;color:var(--text)
}
.field input:focus,.field select:focus{
  outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(15,155,220,.13)
}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 22px;border:none;border-radius:13px;font-size:15px;font-weight:700;
  cursor:pointer;transition:.2s;font-family:inherit;text-decoration:none
}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#0f9bdc,#3bb6ef);color:#fff;box-shadow:0 5px 16px rgba(15,155,220,.36)}
.btn-primary:hover{box-shadow:0 8px 22px rgba(15,155,220,.5);transform:translateY(-2px)}
.btn-green{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 5px 16px rgba(34,197,94,.34)}
.btn-orange{background:linear-gradient(135deg,#ea580c,#f97316);color:#fff;box-shadow:0 5px 16px rgba(249,115,22,.34)}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;box-shadow:0 5px 16px rgba(139,92,246,.34)}
.btn-ghost{background:#fff;color:var(--blue-d);border:2px solid var(--border)}
.btn-ghost:hover{border-color:var(--blue);background:var(--blue-l)}
.btn-sm{padding:8px 14px;font-size:13.5px;border-radius:11px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* ============ GRID ============ */
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:1fr}
.grid-3{grid-template-columns:1fr}
@media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:repeat(3,1fr)}}

/* ============ QUIZ CARD (chọn bộ) ============ */
.qcard{
  background:#fff;border-radius:var(--radius);padding:18px;border:2px solid var(--border);
  box-shadow:var(--shadow);transition:.24s;cursor:pointer;position:relative;overflow:hidden
}
.qcard:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(15,155,220,.24);border-color:var(--blue)}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#0f9bdc,#62c9f5)}
.qcard.g2::before{background:linear-gradient(90deg,#f97316,#fbbf24)}
.qcard .qnum{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.qcard h4{margin:5px 0 6px;font-size:16.5px;color:var(--blue-d)}
.qcard.g2 h4{color:#c2410c}
.qcard p{margin:0;font-size:13px;color:var(--muted)}
.qcard .meta{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.pill{font-size:11.5px;background:var(--blue-l);color:var(--blue-d);padding:3px 10px;border-radius:20px;font-weight:700}
.pill.o{background:#ffedd5;color:#c2410c}
.pill.g{background:var(--green-l);color:#15803d}
.pill.done{background:#dcfce7;color:#15803d}

/* ============ QUIZ PLAY ============ */
.quiz-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px
}
.progress{height:10px;background:#e2eef8;border-radius:20px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#0f9bdc,#62c9f5);border-radius:20px;transition:width .35s}
.timer{
  display:flex;align-items:center;gap:6px;background:#fff7ed;border:2px solid #fed7aa;
  border-radius:12px;padding:5px 12px;font-weight:800;color:#c2410c;font-size:14px
}
.timer.warn{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.qtext{font-size:16.5px;font-weight:600;margin:0 0 14px;line-height:1.65}
.qtable{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px;border-radius:10px;overflow:hidden}
.qtable th{background:var(--blue-l);color:var(--blue-d);padding:9px 8px;border:1px solid var(--border);font-weight:700;text-align:center}
.qtable td{padding:9px 8px;border:1px solid var(--border);text-align:center;background:#fff}
.qtable td:first-child{font-weight:700;background:#f7fbff}

/* ============ OPTIONS ============ */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border:2px solid var(--border);
  border-radius:13px;background:#fff;cursor:pointer;transition:.18s;font-size:15px;text-align:left;
  font-family:inherit;width:100%;color:var(--text)
}
.opt:hover:not(.locked){border-color:var(--blue);background:var(--blue-l);transform:translateX(4px)}
.opt .k{
  flex:0 0 32px;height:32px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px
}
.opt.correct{border-color:var(--green);background:var(--green-l)}
.opt.correct .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fee2e2}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.locked{cursor:default}

/* ============ SHORT ANSWER ============ */
.shortwrap{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.shortwrap input{
  flex:1;min-width:180px;padding:15px 18px;font-size:19px;font-weight:700;text-align:center;
  border:2px solid var(--border);border-radius:13px;font-family:inherit;background:#fafdff;color:var(--blue-d)
}
.shortwrap input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(15,155,220,.13)}

/* ============ FEEDBACK ============ */
.fb{margin-top:14px;padding:14px 16px;border-radius:13px;font-size:14.5px;animation:fade .3s}
.fb.ok{background:var(--green-l);border-left:5px solid var(--green);color:#14532d}
.fb.no{background:#fee2e2;border-left:5px solid var(--red);color:#7f1d1d}
.fb b{display:block;margin-bottom:5px;font-size:15px}
.fb .exp{margin-top:7px;padding-top:7px;border-top:1px dashed rgba(0,0,0,.14);font-size:14px}

/* ============ MASCOT SPEECH ============ */
.mascot-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.mascot-row svg{width:62px;height:62px;flex:0 0 62px}
.bubble{
  background:#fff;border:2px solid var(--border);border-radius:16px;padding:11px 15px;
  font-size:14px;position:relative;flex:1;box-shadow:0 3px 12px rgba(15,155,220,.1)
}
.bubble::before{
  content:'';position:absolute;left:-9px;top:19px;width:0;height:0;
  border:9px solid transparent;border-right-color:var(--border)
}
.bubble::after{
  content:'';position:absolute;left:-6px;top:19px;width:0;height:0;
  border:9px solid transparent;border-right-color:#fff
}

/* ============ RESULT ============ */
.score-circle{
  width:150px;height:150px;border-radius:50%;margin:0 auto 16px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 10px 30px rgba(15,155,220,.34);animation:pop .5s cubic-bezier(.2,1.4,.5,1)
}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.score-circle .num{font-size:42px;font-weight:900;line-height:1}
.score-circle .den{font-size:15px;opacity:.9;margin-top:3px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:#f7fbff;border:1px solid var(--border);border-radius:13px;padding:12px;text-align:center}
.stat .v{font-size:21px;font-weight:800;color:var(--blue-d)}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600}
.weakbox{background:#fff7ed;border:2px dashed #fdba74;border-radius:14px;padding:15px;margin-top:14px}
.weakbox h4{margin:0 0 9px;color:#c2410c;font-size:15.5px;display:flex;gap:7px;align-items:center}
.weakitem{
  background:#fff;border-radius:11px;padding:11px 13px;margin-bottom:9px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  border-left:4px solid var(--orange)
}
.weakitem .t{font-weight:700;font-size:14px}
.weakitem .s{font-size:12px;color:var(--muted)}

/* ============ LEADERBOARD ============ */
.lb-row{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;
  background:#fff;border:1px solid var(--border);margin-bottom:8px;transition:.2s
}
.lb-row:hover{transform:translateX(4px);box-shadow:0 4px 14px rgba(15,155,220,.16)}
.lb-row.top1{background:linear-gradient(100deg,#fff8e1,#fffdf5);border-color:#fde68a}
.lb-row.top2{background:linear-gradient(100deg,#f3f6fa,#fafcff);border-color:#cbd5e1}
.lb-row.top3{background:linear-gradient(100deg,#fff1e6,#fffaf5);border-color:#fdba74}
.lb-rank{font-size:19px;width:38px;text-align:center;font-weight:900;flex:0 0 38px}
.lb-info{flex:1;min-width:0}
.lb-info .n{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-info .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-score{font-weight:900;font-size:17px;color:var(--blue-d);text-align:right}
.lb-score small{display:block;font-size:11px;color:var(--muted);font-weight:600}

/* ============ TEACHER ============ */
.tbl-wrap{overflow-x:auto;border-radius:13px;border:1px solid var(--border);-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
table.data th{background:var(--blue-l);color:var(--blue-d);padding:11px 10px;text-align:left;font-weight:800;white-space:nowrap;position:sticky;top:0}
table.data td{padding:10px;border-top:1px solid var(--border);white-space:nowrap}
table.data tr:hover td{background:#f7fbff}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.tag.good{background:var(--green-l);color:#15803d}
.tag.mid{background:#fef3c7;color:#a16207}
.tag.bad{background:#fee2e2;color:#b91c1c}

/* ============ KNOWLEDGE ============ */
.kbox{border-radius:15px;padding:16px 18px;margin:13px 0;border-left:6px solid}
.kbox.blue{background:linear-gradient(100deg,#eff8ff,#f8fcff);border-color:var(--blue)}
.kbox.green{background:linear-gradient(100deg,#eefbf1,#f8fffa);border-color:var(--green)}
.kbox.orange{background:linear-gradient(100deg,#fff6ed,#fffcf8);border-color:var(--orange)}
.kbox.purple{background:linear-gradient(100deg,#f5f1ff,#fbf9ff);border-color:var(--purple)}
.kbox h4{margin:0 0 9px;font-size:16px;display:flex;align-items:center;gap:8px}
.kbox.blue h4{color:var(--blue-d)}
.kbox.green h4{color:#15803d}
.kbox.orange h4{color:#c2410c}
.kbox.purple h4{color:#6d28d9}
.formula{
  background:#fff;border:2px dashed var(--border);border-radius:12px;padding:13px 15px;
  margin:11px 0;text-align:center;font-size:16px;overflow-x:auto
}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 5px;font-size:.92em}
.frac .num{border-bottom:2px solid currentColor;padding:0 7px 1px}
.frac .den{padding:1px 7px 0}
.note{font-size:13.5px;color:var(--muted);font-style:italic;margin-top:8px}
ul.tight{margin:7px 0;padding-left:20px}
ul.tight li{margin:5px 0}

/* ============ TOAST ============ */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);
  background:#1e293b;color:#fff;padding:13px 24px;border-radius:14px;font-weight:700;
  font-size:14px;z-index:999;transition:.35s;box-shadow:0 10px 30px rgba(0,0,0,.3);
  max-width:88vw;text-align:center
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.ok{background:linear-gradient(135deg,#16a34a,#22c55e)}
#toast.no{background:linear-gradient(135deg,#dc2626,#ef4444)}

/* ============ MISC ============ */
.center{text-align:center}
.muted{color:var(--muted);font-size:13.5px}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.hidden{display:none!important}
.hero{
  background:linear-gradient(135deg,#0f9bdc,#3bb6ef 60%,#7ed0f7);color:#fff;
  border-radius:20px;padding:26px 22px;margin-bottom:16px;position:relative;overflow:hidden;
  box-shadow:0 10px 34px rgba(15,155,220,.34)
}
.hero::after{
  content:'';position:absolute;right:-40px;top:-40px;width:170px;height:170px;
  background:rgba(255,255,255,.14);border-radius:50%
}
.hero::before{
  content:'';position:absolute;right:20px;bottom:-60px;width:120px;height:120px;
  background:rgba(255,255,255,.1);border-radius:50%
}
.hero h2{margin:0 0 7px;font-size:23px;font-weight:900;position:relative;z-index:2}
.hero p{margin:0;opacity:.95;font-size:14.5px;position:relative;z-index:2;max-width:640px}
.hero .dora{position:absolute;right:14px;top:14px;width:76px;height:76px;z-index:3;opacity:.96;animation:bob 3.4s ease-in-out infinite}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#eef7ff}
::-webkit-scrollbar-thumb{background:#a9d9f2;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--blue)}

@media(max-width:600px){
  .brand-txt h1{font-size:14px}
  .brand-txt p{font-size:10.5px}
  .hero h2{font-size:19px}
  .hero .dora{width:58px;height:58px;opacity:.55}
  .sec-title{font-size:18.5px}
  .qtext{font-size:15.5px}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
  .stat .v{font-size:17px}
  .card{padding:16px}
}
</style>
</head>

<script>
/* =====================================================================
   CẤU HÌNH
   ===================================================================== */
const TEACHER_PASSWORD = '0964848989';   // Mật khẩu vào trang Giáo viên
const SEC_PER_QUESTION = 90;             // Thời gian mỗi câu nhóm 2 (giây)
const STORE_KEY = 'toan11_ketnoi_results_v1';
const USER_KEY  = 'toan11_ketnoi_user_v1';

/* ------------------ ĐỒNG BỘ FIREBASE (REST) ------------------------- */
function toFS(obj){
  const f = {};
  for (const [k,v] of Object.entries(obj)){
    if (typeof v === 'number') f[k] = Number.isInteger(v) ? {integerValue:String(v)} : {doubleValue:v};
    else if (typeof v === 'boolean') f[k] = {booleanValue:v};
    else f[k] = {stringValue: String(v)};
  }
  return f;
}
function fromFS(f){
  const o = {};
  for (const [k,v] of Object.entries(f||{})){
    if ('integerValue' in v) o[k] = Number(v.integerValue);
    else if ('doubleValue' in v) o[k] = v.doubleValue;
    else if ('booleanValue' in v) o[k] = v.booleanValue;
    else o[k] = v.stringValue;
  }
  return o;
}
async function cloudSave(rec){
  if (!CLOUD.enabled || !CLOUD.projectId || !CLOUD.apiKey) return;
  try{
    const url = `https://firestore.googleapis.com/v1/projects/${CLOUD.projectId}/databases/(default)/documents/${CLOUD.collection}?key=${CLOUD.apiKey}`;
    await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ fields: toFS(rec) })});
  }catch(e){ console.warn('Cloud save lỗi:', e); }
}
async function cloudLoad(){
  if (!CLOUD.enabled || !CLOUD.projectId || !CLOUD.apiKey) return null;
  try{
    const url = `https://firestore.googleapis.com/v1/projects/${CLOUD.projectId}/databases/(default)/documents/${CLOUD.collection}?key=${CLOUD.apiKey}&pageSize=500`;
    const r = await fetch(url);
    const j = await r.json();
    return (j.documents||[]).map(d => fromFS(d.fields));
  }catch(e){ return null; }
}

function $(s,el=document){ return el.querySelector(s); }
function $$(s,el=document){ return [...el.querySelectorAll(s)]; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tableHTML(t){
  if(!t) return '';
  return `<table class="qtable"><thead><tr>${t.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${t.rows.map(r=>`<tr>${r.map((c,i)=>`<${i===0?'td':'td'}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function toast(msg, type=''){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>{ t.className=''; }, 2400);
}
function parseNum(s){
  if (s===null||s===undefined) return NaN;
  s = String(s).trim().replace(/\s/g,'').replace(/,/g,'.');
  if (/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){
    const [a,b] = s.split('/');
    return parseFloat(a)/parseFloat(b);
  }
  return parseFloat(s);
}
function fmt(n){
  if (Number.isInteger(n)) return String(n);
  return String(Math.round(n*1000)/1000).replace('.',',');
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowStr(){
  const d = new Date();
  return todayStr()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

        x̄ = ${F('m₁x₁ + m₂x₂ + … + m<sub>k</sub>x<sub>k</sub>','n')}
      </div>
      <p>trong đó n = m₁ + … + m<sub>k</sub> là cỡ mẫu, x<sub>i</sub> là giá trị đại diện của nhóm thứ i.</p>
    </div>
    <div class="kbox blue">
      <h4>💡 Ý nghĩa</h4>
      <p>Số trung bình của mẫu số liệu ghép nhóm <b>xấp xỉ</b> số trung bình của mẫu số liệu gốc. Nó cho biết <b>vị trí trung tâm</b> của mẫu số liệu.</p>
    </div>
    <div class="kbox orange">
      <h4>⚠️ Lưu ý khi làm bài</h4>
      <ul class="tight">
        <li>Tính giá trị đại diện cho <b>từng nhóm</b> trước khi nhân với tần số.</li>
        <li>Giữ nguyên đơn vị của đề bài khi kết luận.</li>
        <li>Nếu đề yêu cầu làm tròn, ghi rõ số chữ số thập phân.</li>
      </ul>
    </div>
  </div>

  <div class="card" id="k-median">
    <h2>3️⃣ Trung vị của mẫu số liệu ghép nhóm</h2>
    <div class="kbox purple">
      <h4>🎯 Các bước tìm trung vị M<sub>e</sub></h4>
      <p><b>Bước 1.</b> Xác định <b>nhóm chứa trung vị</b>: nhóm đầu tiên mà tần số tích lũy ≥ n/2. Giả sử là nhóm [a<sub>p</sub> ; a<sub>p+1</sub>) có tần số m<sub>p</sub>.</p>
      <p><b>Bước 2.</b> Áp dụng công thức:</p>
      <div class="formula">
        M<sub>e</sub> = a<sub>p</sub> + ${F('n/2 − (m₁ + … + m<sub>p−1</sub>)','m<sub>p</sub>')} · (a<sub>p+1</sub> − a<sub>p</sub>)
      </div>
    </div>
    <div class="kbox blue">
      <h4>💡 Ý nghĩa</h4>
      <p>Trung vị chia mẫu số liệu thành <b>hai phần bằng nhau</b>, mỗi phần chứa 50% giá trị.</p>
    </div>
  </div>

  <div class="card" id="k-quartile">
    <h2>4️⃣ Tứ phân vị của mẫu số liệu ghép nhóm</h2>
    <div class="kbox purple">
      <h4>📐 Tứ phân vị thứ nhất Q₁</h4>
      <div class="formula">
        Q₁ = a<sub>p</sub> + ${F('n/4 − (m₁ + … + m<sub>p−1</sub>)','m<sub>p</sub>')} · (a<sub>p+1</sub> − a<sub>p</sub>)
      </div>
      <h4 style="margin-top:14px">📐 Tứ phân vị thứ ba Q₃</h4>
      <div class="formula">
        Q₃ = a<sub>p</sub> + ${F('3n/4 − (m₁ + … + m<sub>p−1</sub>)','m<sub>p</sub>')} · (a<sub>p+1</sub> − a<sub>p</sub>)
      </div>
      <p class="note">Nhóm [a<sub>p</sub> ; a<sub>p+1</sub>) tương ứng là nhóm chứa Q₁ hoặc Q₃ (nhóm đầu tiên có tần số tích lũy ≥ n/4 hoặc ≥ 3n/4).</p>
    </div>
    <div class="kbox blue">
      <h4>💡 Ý nghĩa</h4>
      <p>Các tứ phân vị chia mẫu số liệu thành <b>4 phần</b>, mỗi phần chứa 25% giá trị. Đặc biệt <b>Q₂ = M<sub>e</sub></b>.</p>
    </div>
  </div>

  <div class="card" id="k-mode">
    <h2>5️⃣ Mốt của mẫu số liệu ghép nhóm</h2>
    <div class="kbox orange">
      <h4>⭐ Các bước tìm mốt M<sub>o</sub></h4>
      <p><b>Bước 1.</b> Tìm <b>nhóm có tần số lớn nhất</b> (nhóm chứa mốt), giả sử là [a<sub>j</sub> ; a<sub>j+1</sub>) với tần số m<sub>j</sub>.</p>
      <p><b>Bước 2.</b> Áp dụng công thức:</p>
      <div class="formula">
        M<sub>o</sub> = a<sub>j</sub> + ${F('m<sub>j</sub> − m<sub>j−1</sub>','(m<sub>j</sub> − m<sub>j−1</sub>) + (m<sub>j</sub> − m<sub>j+1</sub>)')} · h
      </div>
      <p>trong đó m<sub>j−1</sub>, m<sub>j+1</sub> là tần số hai nhóm kề; h = a<sub>j+1</sub> − a<sub>j</sub> là độ dài nhóm.</p>
    </div>
    <div class="kbox blue">
      <h4>💡 Ý nghĩa</h4>
      <p>Mốt cho biết giá trị <b>xuất hiện nhiều nhất</b>, dùng để đo xu thế trung tâm của mẫu số liệu.</p>
    </div>
  </div>

  <div class="card">
    <h2>📋 Bảng tóm tắt công thức</h2>
    <div class="tbl-wrap">
      <table class="data" style="min-width:600px">
        <thead><tr><th>Đại lượng</th><th>Vị trí cần tìm</th><th>Công thức</th></tr></thead>
        <tbody>
          <tr><td><b>Số trung bình x̄</b></td><td>—</td><td>Σ m<sub>i</sub>x<sub>i</sub> / n</td></tr>
          <tr><td><b>Trung vị M<sub>e</sub></b></td><td>tần số tích lũy ≥ n/2</td><td>a<sub>p</sub> + [(n/2 − F<sub>p−1</sub>)/m<sub>p</sub>]·h</td></tr>
          <tr><td><b>Tứ phân vị Q₁</b></td><td>tần số tích lũy ≥ n/4</td><td>a<sub>p</sub> + [(n/4 − F<sub>p−1</sub>)/m<sub>p</sub>]·h</td></tr>
          <tr><td><b>Tứ phân vị Q₃</b></td><td>tần số tích lũy ≥ 3n/4</td><td>a<sub>p</sub> + [(3n/4 − F<sub>p−1</sub>)/m<sub>p</sub>]·h</td></tr>
          <tr><td><b>Mốt M<sub>o</sub></b></td><td>nhóm có tần số lớn nhất</td><td>a<sub>j</sub> + [(m<sub>j</sub>−m<sub>j−1</sub>)/((m<sub>j</sub>−m<sub>j−1</sub>)+(m<sub>j</sub>−m<sub>j+1</sub>))]·h</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note" style="margin-top:10px">Trong đó F<sub>p−1</sub> = m₁ + m₂ + … + m<sub>p−1</sub> là tần số tích lũy của các nhóm đứng trước nhóm chứa giá trị cần tìm; h là độ dài của nhóm đó.</p>
    <div class="btn-row mt">
      <button class="btn btn-primary" onclick="show('quizlist')">✏️ Sẵn sàng luyện tập →</button>
      <button class="btn btn-ghost" onclick="show('home')">← Về trang chủ</button>
    </div>
  </div>
  `;
}

/* =====================================================================
   QUIZ ENGINE
   ===================================================================== */
function startQuiz(key){
  const q = BANK[key];
  if (!q) return;
  state.quizKey = key;
  state.qi = 0;
  state.answers = [];
  state.startTime = Date.now();
  state.locked = false;
  show('play');
}

function renderPlay(){
  const key = state.quizKey;
  const quiz = BANK[key];
  const i = state.qi;
  const q = quiz.qs[i];
  const g = quiz.group;

  if (state.timerId){ clearInterval(state.timerId); state.timerId = null; }

  const prog = Math.round(((i) / quiz.qs.length) * 100);

  let body = '';
  if (g === 1){
    body = `<div class="opts" id="opts">
      ${q.options.map((o,idx)=>`<button class="opt" data-idx="${idx}">
        <span class="k">${'ABCD'[idx]}</span><span>${o}</span>
      </button>`).join('')}
    </div>
    <div id="fbArea"></div>
    <div class="btn-row mt" id="nextArea" style="display:none">
      <button class="btn btn-primary" id="btnNext">${i<quiz.qs.length-1?'Câu tiếp theo →':'Xem kết quả 🎉'}</button>
    </div>`;
  } else {
    body = `<div class="shortwrap">
      <input id="shortIn" type="text" inputmode="decimal" placeholder="Nhập kết quả..." autocomplete="off">
      <button class="btn btn-orange" id="btnSub">Trả lời</button>
    </div>
    <div id="fbArea"></div>
    <div class="btn-row mt" id="nextArea" style="display:none">
      <button class="btn btn-primary" id="btnNext">${i<quiz.qs.length-1?'Câu tiếp theo →':'Xem kết quả 🎉'}</button>
    </div>`;
  }

  $('#screen-play').innerHTML = `
  <div class="quiz-head">
    <div>
      <div class="muted" style="font-size:12.5px;font-weight:700;letter-spacing:.5px">
        ${g===1?'🟦 NHÓM 1 · TRẮC NGHIỆM':'🟧 NHÓM 2 · TRẢ LỜI NGẮN'}

  <div class="card">
    <div class="mascot-row">

        <ellipse cx="50" cy="53" rx="27" ry="24" fill="#fff"/>
        <ellipse cx="40" cy="32" rx="7.5" ry="10.5" fill="#fff" stroke="#334155" stroke-width="1.4"/>
        <ellipse cx="60" cy="32" rx="7.5" ry="10.5" fill="#fff" stroke="#334155" stroke-width="1.4"/>
        <circle cx="42" cy="34" r="3" fill="#334155"/><circle cx="58" cy="34" r="3" fill="#334155"/>
        <circle cx="50" cy="47" r="5" fill="#e53935"/>
        <path d="M50 52 Q50 63 40 63" stroke="#334155" fill="none" stroke-width="1.5"/>
        <path d="M50 52 Q50 63 60 63" stroke="#334155" fill="none" stroke-width="1.5"/>
        <rect x="23" y="72" width="54" height="7" fill="#e53935" rx="3.5"/>
        <circle cx="50" cy="83" r="6.5" fill="#fdd835" stroke="#334155" stroke-width="1.4"/>
      </svg>
      <div class="bubble" id="bubble">Cố lên nhé! Đọc kĩ đề rồi hãy chọn đáp án 💪</div>
    </div>
    <div class="qtext">${q.q}</div>
    ${tableHTML(q.table)}

    });

function startTimer(){
  state.timeLeft = SEC_PER_QUESTION;
  const el = $('#tsec');
  const box = $('#timer');
  if (el) el.textContent = state.timeLeft;
  state.timerId = setInterval(()=>{
    state.timeLeft--;
    if (el) el.textContent = state.timeLeft;
    if (box){
      if (state.timeLeft <= 15) box.classList.add('warn');
      else box.classList.remove('warn');
    }
    if (state.timeLeft <= 0){
      clearInterval(state.timerId);
      state.timerId = null;
      if (!state.locked) answerShort(true);
    }
  }, 1000);
}

function setBubble(txt, mood){
  const b = $('#bubble');
  if (b) b.textContent = txt;
}

function answerMCQ(idx){
  if (state.locked) return;
  state.locked = true;
  const quiz = BANK[state.quizKey];
  const q = quiz.qs[state.qi];
  const correct = idx === q.ans;

  $$('#opts .opt').forEach((btn,i)=>{
    btn.classList.add('locked');
    btn.onclick = null;
    if (i === q.ans) btn.classList.add('correct');
    if (i === idx && !correct) btn.classList.add('wrong');
  });

  state.answers.push({
    qIndex: state.qi, topic: q.topic,
    userAns: 'ABCD'[idx], correctAns: 'ABCD'[q.ans],
    ok: correct, question: q.q + (q.ask? ' ' + q.ask : '')
  });

  const fb = $('#fbArea');
  fb.innerHTML = `<div class="fb ${correct?'ok':'no'}">
    <b>${correct?'✅ Chính xác! Tuyệt vời!':'❌ Chưa đúng rồi!'}</b>
    Đáp án đúng là <b>${'ABCD'[q.ans]}. ${q.options[q.ans]}</b>.
    <div class="exp">💡 <b>Lời giải:</b> ${q.explain}</div>
  </div>`;

  setBubble(correct ? 'Giỏi quá! Tiếp tục phát huy nhé 🎉' : 'Không sao, xem lời giải rồi làm lại nhé! 💪');

  $('#nextArea').style.display = 'flex';
  $('#btnNext').onclick = nextQuestion;
  $('#btnNext').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function answerShort(timeout){
  if (state.locked) return;
  state.locked = true;
  if (state.timerId){ clearInterval(state.timerId); state.timerId = null; }

  const quiz = BANK[state.quizKey];
  const q = quiz.qs[state.qi];
  const inp = $('#shortIn');
  const raw = inp ? inp.value.trim() : '';
  const v = parseNum(raw);
  const tol = (q.tol !== undefined) ? q.tol : 0.02;
  const correct = !timeout && !isNaN(v) && Math.abs(v - q.ans) <= tol;

  if (inp) inp.disabled = true;
  const bs = $('#btnSub');
  if (bs) bs.disabled = true;

  state.answers.push({
    qIndex: state.qi, topic: q.topic,
    userAns: timeout ? '(hết giờ)' : (raw || '(bỏ trống)'),
    correctAns: fmt(q.ans), ok: correct, question: q.q
  });

  const fb = $('#fbArea');
  fb.innerHTML = `<div class="fb ${correct?'ok':'no'}">
    <b>${correct?'✅ Chính xác! Tuyệt vời!':(timeout?'⏰ Hết thời gian!':'❌ Chưa đúng rồi!')}</b>
    Đáp án đúng là <b>${fmt(q.ans)}</b>${raw?` — Em đã trả lời: <b>${esc(raw)}</b>`:''}.
    <div class="exp">💡 <b>Lời giải:</b> ${q.explain}</div>
  </div>`;

  setBubble(correct ? 'Xuất sắc! Em tính rất chuẩn 🎯' : 'Cùng xem lại cách giải để nhớ lâu hơn nhé! 📖');

  $('#nextArea').style.display = 'flex';
  $('#btnNext').onclick = nextQuestion;
  $('#btnNext').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function nextQuestion(){
  const quiz = BANK[state.quizKey];
  state.qi++;
  state.locked = false;
  if (state.qi >= quiz.qs.length){
    finishQuiz();
  } else {
    show('play');
  }
}

function quitQuiz(){
  if (state.timerId){ clearInterval(state.timerId); state.timerId = null; }
  if (confirm('Em có chắc muốn thoát? Kết quả bài làm sẽ không được lưu.')){
    show('quizlist');
  }
}

/* =====================================================================
   FINISH + PHÂN TÍCH
   ===================================================================== */
function finishQuiz(){
  const quiz = BANK[state.quizKey];
  const total = quiz.qs.length;
  const score = state.answers.filter(a=>a.ok).length;
  const timeSpent = Math.round((Date.now() - state.startTime)/1000);

  // thống kê theo chủ đề
  const stat = {};
  state.answers.forEach(a=>{
    if (!stat[a.topic]) stat[a.topic] = { ok:0, total:0 };
    stat[a.topic].total++;
    if (a.ok) stat[a.topic].ok++;
  });

  const weak = Object.entries(stat)
    .filter(([t,s]) => s.ok < s.total)              // có câu sai
    .map(([t,s]) => ({ topic:t, wrong: s.total - s.ok, total: s.total, rate: (s.total-s.ok)/s.total }))
    .sort((a,b)=> b.rate - a.rate);

  const rec = {
    id: 'r' + Date.now() + Math.random().toString(36).slice(2,7),
    name: state.user.name,
    cls: state.user.cls,
    school: state.user.school,
    quizKey: state.quizKey,
    quizTitle: quiz.title,
    group: quiz.group,
    score, total,
    timeSpent,
    date: todayStr(),
    time: nowStr(),
    weakTopics: weak.map(w=>w.topic).join(','),
    detail: JSON.stringify(state.answers.map(a=>({t:a.topic, ok:a.ok?1:0})))
  };
  addResult(rec);
  state.lastRec = rec;
  state.lastWeak = weak;
  show('result');
}

function renderResult(){
  const rec = state.lastRec;
  if (!rec){ show('home'); return; }
  const pct = Math.round(rec.score/rec.total*100);
  const weak = state.lastWeak || [];

  let color = '#ef4444', grade = 'Cần cố gắng thêm 💪', emoji='😢';
  if (pct >= 90){ color='#16a34a'; grade='Xuất sắc! Em là cao thủ Toán! 🏆'; emoji='🌟'; }
  else if (pct >= 70){ color='#22c55e'; grade='Khá tốt! Cố thêm chút nữa nhé! 👏'; emoji='😊'; }
  else if (pct >= 50){ color='#f59e0b'; grade='Trung bình — cần ôn lại công thức! 📚'; emoji='🙂'; }
  else { color='#ef4444'; grade='Cần cố gắng nhiều hơn! Hãy ôn lại kiến thức 💪'; emoji='😢'; }

  const mm = String(Math.floor(rec.timeSpent/60)).padStart(2,'0');
  const ss = String(rec.timeSpent%60).padStart(2,'0');

  $('#screen-result').innerHTML = `
  <div class="card center">
    <div class="score-circle" style="background:linear-gradient(135deg,${color},${color}cc)">
      <div class="num">${rec.score}/${rec.total}</div>
      <div class="den">${pct}%</div>
    </div>
    <h2 style="justify-content:center">${emoji} ${grade}</h2>
    <p class="muted">${esc(rec.quizTitle)} — ${esc(state.user.name)} · ${esc(state.user.cls)}</p>

    <div class="stat-grid">
      <div class="stat"><div class="v">${rec.score}</div><div class="l">Câu đúng</div></div>
      <div class="stat"><div class="v">${rec.total-rec.score}</div><div class="l">Câu sai</div></div>
      <div class="stat"><div class="v">${mm}:${ss}</div><div class="l">Thời gian</div></div>
    </div>
  </div>

  ${weak.length ? `
  <div class="card">
    <div class="weakbox">
      <h4>🔍 Em còn yếu ở những phần kiến thức sau:</h4>
      ${weak.map(w=>{
        const T = TOPICS[w.topic];
        return `<div class="weakitem">
          <div>
            <div class="t">${T.icon} ${T.name}</div>
            <div class="s">Sai ${w.wrong}/${w.total} câu (${Math.round(w.rate*100)}%)</div>
          </div>
          <button class="btn btn-orange btn-sm" onclick="goReview('${T.anchor}')">📖 Ôn lại ngay</button>
        </div>`;
      }).join('')}
      <p class="muted" style="margin:6px 0 0">👉 Bấm <b>"Ôn lại ngay"</b> để xem lại công thức và ví dụ của phần đó trước khi làm lại bài.</p>
    </div>
  </div>` : `
  <div class="card">
    <div class="fb ok">
      <b>🎉 Tuyệt vời! Em không sai câu nào!</b>
      Em đã nắm rất vững tất cả các dạng bài về số trung bình, trung vị, tứ phân vị và mốt. Hãy thử sức với bộ đề khác nhé!
    </div>
  </div>`}

  <div class="card">
    <h2>📋 Chi tiết từng câu</h2>
    ${state.answers.map((a,i)=>{
      const T = TOPICS[a.topic];
      return `<div class="lb-row" style="${a.ok?'':'background:#fff5f5;border-color:#fecaca'}">
        <div class="lb-rank" style="font-size:15px">${a.ok?'✅':'❌'}</div>
        <div class="lb-info">
          <div class="n">Câu ${i+1} · ${T.icon} ${T.name}</div>
          <div class="m">Em chọn: <b>${esc(a.userAns)}</b> — Đáp án: <b style="color:#16a34a">${esc(String(a.correctAns))}</b></div>
        </div>
      </div>`;
    }).join('')}
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="startQuiz('${rec.quizKey}')">🔄 Làm lại bộ này</button>
    <button class="btn btn-orange" onclick="show('quizlist')">📚 Chọn bộ khác</button>
    <button class="btn btn-purple" onclick="show('leaderboard')">🏆 Xem xếp hạng</button>
    <button class="btn btn-ghost" onclick="show('home')">🏠 Trang chủ</button>
  </div>
  `;
  window.scrollTo({top:0, behavior:'smooth'});
}

function goReview(anchor){
  show('knowledge');
  setTimeout(()=>{
    const el = document.getElementById(anchor);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 180);
}

/* =====================================================================
   SCREEN: LEADERBOARD
   ===================================================================== */
function renderLeaderboard(){
  const all = loadResults();
  const today = todayStr();

  // Tổng hợp tốt nhất mỗi học sinh trong ngày (theo tổng điểm / tổng câu)
  const byStudent = {};
  all.filter(r=>r.date===today).forEach(r=>{
    const k = r.name+'|'+r.cls;
    if (!byStudent[k]) byStudent[k] = { name:r.name, cls:r.cls, school:r.school, score:0, total:0, best:0, count:0, time:0 };
    byStudent[k].score += r.score;
    byStudent[k].total += r.total;
    byStudent[k].best = Math.max(byStudent[k].best, r.score);
    byStudent[k].count++;
    byStudent[k].time += r.timeSpent;
  });

  const rows = Object.values(byStudent)
    .map(s=>({ ...s, pct: s.total? s.score/s.total : 0 }))
    .sort((a,b)=> b.pct - a.pct || a.time - b.time)
    .slice(0,20);

  const medals = ['🥇','🥈','🥉'];

  $('#screen-leaderboard').innerHTML = `
  <div class="sec-title">🏆 Bảng xếp hạng ngày ${today.split('-').reverse().join('/')}</div>

  <div class="card">
    <h2>🌟 Top học sinh hôm nay</h2>
    <p class="muted" style="margin-top:-6px">Xếp hạng theo <b>tỉ lệ đúng</b>, nếu bằng nhau thì ưu tiên bạn có tổng thời gian làm bài ít hơn.</p>
    ${rows.length ? rows.map((r,i)=>`
      <div class="lb-row ${i===0?'top1':i===1?'top2':i===2?'top3':''}">
        <div class="lb-rank">${medals[i] || (i+1)}</div>
        <div class="lb-info">
          <div class="n">${esc(r.name)} ${r.name===state.user.name && r.cls===state.user.cls ? '⭐ (em)' : ''}</div>
          <div class="m">Lớp ${esc(r.cls)} · ${esc(r.school||'')} · Đã làm ${r.count} bộ đề</div>
        </div>
        <div class="lb-score">${Math.round(r.pct*100)}%<small>${r.score}/${r.total} câu</small></div>
      </div>`).join('') :
      `<div class="fb" style="background:#f1f5f9;border-left-color:#94a3b8;color:#475569">
        <b>Chưa có ai làm bài hôm nay.</b> Hãy là người đầu tiên lên bảng xếp hạng! 🚀
      </div>`}
  </div>

  <div class="card">
    <h2>📊 Thống kê chung</h2>
    <div class="stat-grid">
      <div class="stat"><div class="v">${all.filter(r=>r.date===today).length}</div><div class="l">Lượt làm bài</div></div>
      <div class="stat"><div class="v">${Object.keys(byStudent).length}</div><div class="l">Học sinh</div></div>
      <div class="stat"><div class="v">${all.length}</div><div class="l">Tổng lượt (mọi ngày)</div></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="show('quizlist')">✏️ Làm bài để leo hạng</button>
    <button class="btn btn-ghost" onclick="show('home')">🏠 Trang chủ</button>
  </div>
  `;
}

/* =====================================================================
   SCREEN: TEACHER
   ===================================================================== */
let teacherAuthed = false;

function renderTeacher(){
  if (!teacherAuthed){
    $('#screen-teacher').innerHTML = `
    <div class="sec-title">👨‍🏫 Trang giáo viên</div>
    <div class="card" style="max-width:440px;margin:0 auto">
      <h2>🔒 Đăng nhập giáo viên</h2>
      <p class="muted" style="margin-top:-6px">Nhập mật khẩu để xem điểm thi và thống kê của học sinh.</p>
      <div class="field">
        <label>Mật khẩu</label>
        <input id="tPass" type="password" placeholder="Nhập mật khẩu..." autocomplete="off">
      </div>
      <button class="btn btn-purple btn-block" id="btnTeacherLogin">Đăng nhập</button>
      <p class="muted center mt" style="font-size:12px">Mật khẩu mặc định: 0964848989 (có thể đổi trong mã nguồn)</p>
    </div>`;
    const go = ()=>{
      if ($('#tPass').value === TEACHER_PASSWORD){
        teacherAuthed = true;
        renderTeacher();
      } else toast('Mật khẩu không đúng!','no');
    };
    $('#btnTeacherLogin').onclick = go;
    $('#tPass').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    return;
  }

  const all = loadResults();

  if (!all.length){
    $('#screen-teacher').innerHTML = `
    <div class="sec-title">👨‍🏫 Trang giáo viên</div>
    <div class="card">
      <div class="fb" style="background:#f1f5f9;border-left-color:#94a3b8;color:#475569">
        <b>Chưa có dữ liệu bài làm nào.</b> Học sinh cần đăng nhập và hoàn thành ít nhất 1 bộ đề.
      </div>
      <button class="btn btn-ghost mt" onclick="show('home')">← Về trang chủ</button>
    </div>`;
    return;
  }

  const classes = [...new Set(all.map(r=>r.cls))].sort();
  const quizzes = [...new Set(all.map(r=>r.quizKey))];

  // thống kê theo chủ đề
  const topicStat = {};
  Object.keys(TOPICS).forEach(t=>topicStat[t] = { ok:0, total:0 });
  all.forEach(r=>{
    try{
      const d = JSON.parse(r.detail || '[]');
      d.forEach(x=>{
        if (!topicStat[x.t]) topicStat[x.t] = { ok:0, total:0 };
        topicStat[x.t].total++;
        if (x.ok) topicStat[x.t].ok++;
      });
    }catch(e){}
  });

  $('#screen-teacher').innerHTML = `
  <div class="sec-title">👨‍🏫 Trang giáo viên — Thống kê kết quả
    <span class="badge">${all.length} lượt làm bài</span>
  </div>

  <div class="card">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <div class="field" style="margin:0;flex:1;min-width:170px">
        <label style="font-size:12.5px">Lọc theo lớp</label>
        <select id="fClass"><option value="">Tất cả lớp</option>${classes.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
      </div>
      <div class="field" style="margin:0;flex:1;min-width:170px">
        <label style="font-size:12.5px">Lọc theo bộ đề</label>
        <select id="fQuiz"><option value="">Tất cả bộ đề</option>${quizzes.map(k=>`<option value="${k}">${esc(BANK[k]?BANK[k].title:k)}</option>`).join('')}</select>
      </div>
      <div class="field" style="margin:0;flex:1;min-width:150px">
        <label style="font-size:12.5px">Lọc theo ngày</label>
        <input id="fDate" type="date">
      </div>
      <button class="btn btn-ghost btn-sm" id="btnClear">Xóa lọc</button>
    </div>
    <div class="btn-row mt">
      <button class="btn btn-green btn-sm" id="btnExport">⬇️ Xuất CSV</button>
      <button class="btn btn-ghost btn-sm" id="btnRefresh">🔄 Làm mới</button>
      <button class="btn btn-ghost btn-sm" id="btnCloud">☁️ Đồng bộ đám mây</button>
      <button class="btn btn-ghost btn-sm" id="btnLogout">Đăng xuất</button>
    </div>
  </div>

  <div class="card">
    <h2>📊 Phân tích theo chủ đề kiến thức</h2>
    <div class="tbl-wrap">
      <table class="data" style="min-width:520px">
        <thead><tr><th>Chủ đề</th><th>Số câu</th><th>Đúng</th><th>Tỉ lệ đúng</th><th>Đánh giá</th></tr></thead>
        <tbody>
          ${Object.entries(topicStat).map(([t,s])=>{
            const T = TOPICS[t]; if(!T) return '';
            const p = s.total? Math.round(s.ok/s.total*100) : 0;
            const cls = p>=80?'good':p>=50?'mid':'bad';
            const lbl = p>=80?'Tốt':p>=50?'Trung bình':'Yếu';
            return `<tr>
              <td>${T.icon} ${T.name}</td>
              <td>${s.total}</td>
              <td>${s.ok}</td>
              <td><b style="color:${p>=80?'#16a34a':p>=50?'#f59e0b':'#dc2626'}">${p}%</b></td>
              <td><span class="tag ${cls}">${lbl}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>📋 Danh sách bài làm <span id="cntLbl" class="pill"></span></h2>
    <div class="tbl-wrap">
      <table class="data" id="tblResults">
        <thead><tr>
          <th>#</th><th>Họ và tên</th><th>Lớp</th><th>Trường</th>
          <th>Bộ đề</th><th>Nhóm</th><th>Điểm</th><th>Tỉ lệ</th><th>Thời gian</th><th>Thời điểm</th><th>Phần yếu</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  `;

  const renderTable = ()=>{
    const fc = $('#fClass').value;
    const fq = $('#fQuiz').value;
    const fd = $('#fDate').value;
    let rows = all.slice().reverse();
    if (fc) rows = rows.filter(r=>r.cls===fc);
    if (fq) rows = rows.filter(r=>r.quizKey===fq);
    if (fd) rows = rows.filter(r=>r.date===fd);

    const tb = $('#tblResults tbody');
    tb.innerHTML = rows.map((r,i)=>{
      const p = Math.round(r.score/r.total*100);
      const cls = p>=80?'good':p>=50?'mid':'bad';
      const wt = (r.weakTopics||'').split(',').filter(Boolean).map(t=>TOPICS[t]?TOPICS[t].icon+' '+TOPICS[t].name:t).join(', ') || '—';
      const mm = String(Math.floor(r.timeSpent/60)).padStart(2,'0');
      const ss = String(r.timeSpent%60).padStart(2,'0');
      return `<tr>
        <td>${i+1}</td>
        <td><b>${esc(r.name)}</b></td>
        <td>${esc(r.cls)}</td>
        <td>${esc(r.school||'')}</td>
        <td>${esc(BANK[r.quizKey]?BANK[r.quizKey].title:r.quizTitle)}</td>
        <td>${r.group===1?'Trắc nghiệm':'Trả lời ngắn'}</td>
        <td><b style="color:${p>=80?'#16a34a':p>=50?'#f59e0b':'#dc2626'}">${r.score}/${r.total}</b></td>
        <td><span class="tag ${cls}">${p}%</span></td>
        <td>${mm}:${ss}</td>
        <td>${esc(r.time)}</td>
        <td style="white-space:normal;max-width:220px;font-size:12px">${esc(wt)}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="11" style="text-align:center;padding:22px;color:#94a3b8">Không có dữ liệu phù hợp bộ lọc.</td></tr>`;

    $('#cntLbl').textContent = rows.length + ' bản ghi';
  };

  renderTable();
  $('#fClass').onchange = renderTable;
  $('#fQuiz').onchange = renderTable;
  $('#fDate').onchange = renderTable;
  $('#btnClear').onclick = ()=>{ $('#fClass').value=''; $('#fQuiz').value=''; $('#fDate').value=''; renderTable(); };
  $('#btnRefresh').onclick = ()=>{ renderTeacher(); toast('Đã làm mới dữ liệu','ok'); };
  $('#btnLogout').onclick = ()=>{ teacherAuthed=false; renderTeacher(); };

  $('#btnExport').onclick = ()=>{
    const head = ['Ho ten','Lop','Truong','Bo de','Nhom','Diem','Tong cau','Ti le %','Thoi gian (s)','Thoi diem','Phan yeu'];
    const lines = [head.join(',')];
    all.forEach(r=>{
      const p = Math.round(r.score/r.total*100);
      const wt = (r.weakTopics||'').split(',').filter(Boolean).map(t=>TOPICS[t]?TOPICS[t].name:t).join(' | ');
      lines.push([
        r.name, r.cls, r.school||'', (BANK[r.quizKey]?BANK[r.quizKey].title:r.quizTitle),
        r.group===1?'Trac nghiem':'Tra loi ngan',
        r.score, r.total, p, r.timeSpent, r.time, wt
      ].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(','));
    });
    const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ket_qua_toan11_' + todayStr() + '.csv';
    a.click();
    toast('Đã xuất file CSV','ok');
  };

  $('#btnCloud').onclick = async ()=>{
    if (!CLOUD.enabled){
      alert('Đồng bộ đám mây chưa được bật.\n\nĐể bật: mở file HTML, tìm đối tượng CLOUD ở đầu <script>, điền projectId + apiKey của Firebase và đặt enabled: true.');
      return;
    }
    toast('Đang đồng bộ...');
    const remote = await cloudLoad();
    if (!remote){ toast('Đồng bộ thất bại, kiểm tra cấu hình!','no'); return; }
    const local = loadResults();
    const map = {};
    [...local, ...remote].forEach(r=>{ map[r.id] = r; });
    const merged = Object.values(map).sort((a,b)=> a.time < b.time ? -1 : 1);
    saveResults(merged);
    toast('Đã đồng bộ ' + remote.length + ' bản ghi','ok');
    renderTeacher();
  };
}

/* =====================================================================
   KHỞI TẠO
   ===================================================================== */
const RENDER = {
  login: renderLogin,
  home: renderHome,
  knowledge: renderKnowledge,
  quizlist: renderQuizList,
  play: renderPlay,
  result: renderResult,
  leaderboard: renderLeaderboard,
  teacher: renderTeacher
};

function init(){
  // tạo các screen container
  const app = $('#app');
  app.innerHTML = SCREENS.map(s=>`<div class="screen" id="screen-${s}"></div>`).join('');

  // đăng ký hàm show toàn cục để dùng trong onclick
  window.show = show;
  window.startQuiz = startQuiz;
  window.quitQuiz = quitQuiz;
  window.goReview = goReview;

  // tự động đăng nhập nếu đã có
  if (state.user && state.user.name){
    show('home');
  } else {
    show('login');
  }

  // đồng bộ đám mây định kỳ khi vào trang xếp hạng / giáo viên
  if (CLOUD.enabled){
    cloudLoad().then(remote=>{
      if (!remote || !remote.length) return;
      const local = loadResults();
      const map = {};
      [...local, ...remote].forEach(r=>{ map[r.id] = r; });
      saveResults(Object.values(map));
    });
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
